[package]
name = "theyrefor-server"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bincode = "1.3"
futures = "0.3"
http = "1.0"
log = "*"
moka = { version = "0.12", features = ["future"] }
mime = "0.3"
rand = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rocket = { version = "0.5", features = ["json", "secrets" ] }
serde = { version = "1", features = ["derive" ] }
serde_millis = "0.1"
serde_json = "1.0"
serde_urlencoded = "0.7"
theyrefor-models = { path = "../models", features = ["twilight-model"] }
twilight-http = "0.16"
twilight-model = "0.16"
urlencoding = "2.1"