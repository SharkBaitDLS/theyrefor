[package]
name = "theyrefor-ui"
version = "0.1.0"
edition = "2024"
authors = ["Isaac M. Good <imgood@imgoodproductions.org>"]

[dependencies]
theyrefor-models = { path = "../models" }

base64 = { workspace = true }
bincode = { workspace = true }
err-into = { workspace = true }
http = { workspace = true }
log = { workspace = true }
serde = { workspace = true }

reqwasm = "0.5"
url = "2.2"
urlencoding = "2.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-logger = "0.2"
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"

[dependencies.web-sys]
features = [
   "Document",
   "Element",
   "Event",
   "EventTarget",
   "HtmlCollection",
   "HtmlInputElement",
   "HtmlMediaElement",
   "Location",
   "MouseEvent",
   "Node",
   "NodeList",
   "Window"
]
version = "0.3"
